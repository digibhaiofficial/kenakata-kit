# Push a tag like v3.11.0 → checks run, the zip is built and attached to a new GitHub release.
# Shops then see "Update available" in WordPress (includes/updater.php reads the latest release).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: PHP 7.4 syntax
        run: find kenakata-kit -name '*.php' -print0 | xargs -0 -n1 php -l | (! grep -v '^No syntax errors')
      - name: JS syntax
        run: for f in $(find kenakata-kit -name '*.js'); do node --check "$f"; done
      - name: Tag matches the plugin version
        run: |
          V=$(grep -oP "define\( 'KK_VERSION', '\K[^']+" kenakata-kit/kenakata-kit.php)
          H=$(grep -oP '\* Version:\s+\K\S+' kenakata-kit/kenakata-kit.php)
          test "$V" = "$H" || { echo "Version mismatch: header $H, KK_VERSION $V"; exit 1; }
          test "v$V" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $V"; exit 1; }
          if grep -q "__KK_PUBKEY__" kenakata-kit/includes/license.php; then echo "License public key missing"; exit 1; fi
          echo "V=$V" >> "$GITHUB_ENV"
      - name: Minify assets
        run: sh dev/minify.sh
      - name: Build zip
        run: python3 dev/build-zip.py
      - name: Sign the zip (updates are checked with KK_RELEASE_PUBKEY)
        env:
          KK_SIGNING_KEY: ${{ secrets.KK_RELEASE_SIGNING_KEY }}
        run: |
          if [ -z "$KK_SIGNING_KEY" ]; then echo "::warning::Secret KK_RELEASE_SIGNING_KEY is not set: this release is NOT signed"; exit 0; fi
          umask 077
          # Rebuild a clean PEM whatever way the key was pasted (with or without the BEGIN/END lines, Windows line
          # ends, one long line…): keep only the base64 body, wrap it at 64 characters.
          B64=$(printf '%s' "$KK_SIGNING_KEY" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d ' \n\t')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s\n' "$B64" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$RUNNER_TEMP/k.pem"
          openssl pkey -in "$RUNNER_TEMP/k.pem" -noout 2>/dev/null || { rm -f "$RUNNER_TEMP/k.pem"; echo "::error::KK_RELEASE_SIGNING_KEY is not a valid Ed25519 private key (paste the whole kk-release-signing-key.pem file)"; exit 1; }
          openssl pkeyutl -sign -rawin -inkey "$RUNNER_TEMP/k.pem" -in "dist/kenakata-kit-$V.zip" -out "$RUNNER_TEMP/sig.bin"
          rm -f "$RUNNER_TEMP/k.pem"
          base64 -w0 "$RUNNER_TEMP/sig.bin" > "dist/kenakata-kit-$V.zip.sig"
          # The key must match the public key inside the plugin, or every site would refuse this update.
          PUB=$(grep -oP "define\( 'KK_RELEASE_PUBKEY', '\K[^']+" kenakata-kit/includes/license.php)
          php -r 'exit( sodium_crypto_sign_verify_detached( base64_decode( file_get_contents( $argv[1] ) ), file_get_contents( $argv[2] ), base64_decode( $argv[3] ) ) ? 0 : 1 );' "dist/kenakata-kit-$V.zip.sig" "dist/kenakata-kit-$V.zip" "$PUB" || { echo "::error::Signature does not match KK_RELEASE_PUBKEY"; exit 1; }
          echo "Signed: dist/kenakata-kit-$V.zip.sig"
      - name: Release notes from readme.txt
        run: |
          awk -v v="= $V =" '$0==v{f=1;next} /^= [0-9]/{if(f)exit} f' kenakata-kit/readme.txt > notes.md
          test -s notes.md || echo "Kenakata Kit $V" > notes.md
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Two tags pushed together finish in any order: "Latest" must always be the highest version
          # (the plugin's updater follows it), never simply the one that finished last.
          FILES="dist/kenakata-kit-$V.zip"; [ -f "dist/kenakata-kit-$V.zip.sig" ] && FILES="$FILES dist/kenakata-kit-$V.zip.sig"
          gh release create "$GITHUB_REF_NAME" $FILES --title "Kenakata Kit $V" --notes-file notes.md --latest=false
          HIGH=$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName' | sort -V | tail -1)
          gh release edit "$HIGH" --latest
