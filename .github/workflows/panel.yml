# Publishes license-panel/ to GitHub Pages (https://digibhaiofficial.github.io/kenakata-kit/).
# The page holds no secret: the signing key stays encrypted in the owner's browser and private repo.
name: License panel
on:
  push:
    branches: [main]
    paths: ['license-panel/**', '.github/workflows/panel.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: license-panel
      - id: deployment
        uses: actions/deploy-pages@v4
